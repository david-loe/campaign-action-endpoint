[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campaign-action-endpoint"
version = "0.1.0"
description = "Self-hosted campaign confirmations and forms"
requires-python = ">=3.13"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-SQLAlchemy>=3.1,<4",
  "Flask-WTF>=1.2,<2",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "cryptography>=46,<51",
  "email-validator>=2.2,<3",
  "gunicorn>=23,<24",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]
browser = ["playwright>=1.63,<2"]

[tool.setuptools.packages.find]
include = ["campaign_action*"]

[tool.setuptools.package-data]
campaign_action = ["templates/*.html", "static/*", "migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
