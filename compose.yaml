services:
  app:
    image: ghcr.io/david-loe/campaign-action-endpoint:main
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      ENCYPTION_SECRET: ${ENCYPTION_SECRET:?Generate ENCYPTION_SECRET with openssl rand -hex 32}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set an admin password of at least 12 characters}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      DATABASE_PATH: /data/app.sqlite3
    volumes:
      - campaign-data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  campaign-data:
